<!doctype html>
<html lang="en" data-theme="dawn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4EFE3" />
    <title>CoolNasheed — vocals of light</title>
    <meta
      name="description"
      content="CoolNasheed is a streaming home for Islamic nasheeds: recordings people upload, line-by-line lyrics with Arabic and translation, and cover art from the publisher."
    />
    <script>
      /* The app's first paint is light. A listener who picked the night book gets it back
         before anything renders — this runs before the stylesheet is applied, so there is
         no flash of the wrong theme. Only a theme that was actually chosen counts: the
         app also writes the value it is showing, and an inherited night value must not
         masquerade as a preference on a machine that never made one. */
      try {
        var savedTheme =
          localStorage.getItem("coolnasheed.theme.chosen") === "1"
            ? localStorage.getItem("coolnasheed.theme")
            : null;
        if (savedTheme === "night" || savedTheme === "dawn") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (err) {
        /* private mode and blocked storage: the default stands */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A1613'/%3E%3Cpath d='M16 4.6l2.6 6.2 6.7-1.3-3.4 5.9 5.5 3.8-6.7 1.4.5 6.8-5.2-4.1-5.2 4.1.5-6.8L4.6 19.2l5.5-3.8-3.4-5.9 6.7 1.3z' fill='%23D9B871'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
